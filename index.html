<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,"><title>攀巔 — 2D 合作登山</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111;touch-action:none;font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;color:#fff;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,20,35,.82);padding:20px;text-align:center;z-index:5;overflow:auto}
.hide{display:none!important}
h1{font-size:46px;margin:0;letter-spacing:6px;text-shadow:0 4px 0 #b4512a}
.sub{opacity:.8;margin:0 0 6px}
button{font:inherit;font-size:18px;padding:12px 18px;border:0;border-radius:12px;background:#f2a33a;color:#2a1600;font-weight:700;min-width:200px;touch-action:manipulation}
button.alt{background:#3d6b8c;color:#fff}
input{font:inherit;font-size:18px;padding:10px;border-radius:10px;border:0;width:200px;text-align:center;-webkit-user-select:text;user-select:text}
.help{font-size:13px;line-height:1.6;opacity:.85;max-width:340px;text-align:left;background:rgba(255,255,255,.07);padding:10px 14px;border-radius:10px}
#plist{list-style:none;padding:0;margin:4px 0;min-width:220px}
#plist li{padding:6px;margin:3px;border-radius:8px;background:rgba(255,255,255,.1)}
#ctl{position:fixed;left:0;right:0;bottom:0;height:200px;z-index:3;pointer-events:none}
.b{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;pointer-events:auto;touch-action:none}
.b.on{background:rgba(255,200,80,.5)}
#status{min-height:20px;color:#ffd27a;font-size:14px}
#hintb{position:fixed;left:12px;top:78px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:18px;z-index:3;padding:0;min-width:0}
#ctl.hide~#hintb{display:none}
#toast{position:fixed;top:175px;left:0;right:0;text-align:center;z-index:4;pointer-events:none;font-weight:700;text-shadow:0 2px 3px #000}
</style></head><body>
<canvas id="c"></canvas>
<div id="toast"></div>
<div id="ctl" class="hide">
 <div class="b" data-k="left"  style="left:10px;bottom:62px">◀</div>
 <div class="b" data-k="right" style="left:118px;bottom:62px">▶</div>
 <div class="b" data-k="up"    style="left:64px;bottom:120px">▲</div>
 <div class="b" data-k="down"  style="left:64px;bottom:6px">▼</div>
 <div class="b" data-k="grab"  style="right:96px;bottom:20px;width:76px;height:76px">抓</div>
 <div class="b" data-k="jump"  style="right:10px;bottom:70px;width:76px;height:76px">跳</div>
</div>
<button id="hintb" aria-label="提示">？</button>
<div id="menu" class="ov">
 <h1>攀巔</h1><p class="sub">2D 合作登山 · 最多 4 人</p>
 <input id="nick" maxlength="8" placeholder="暱稱">
 <button id="bSolo">單人遊玩</button>
 <button id="bHost" class="alt">建立房間</button>
 <div style="display:flex;gap:6px"><input id="code" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="4位數邀請碼" style="width:130px"><button id="bJoin" class="alt" style="min-width:80px">加入房間</button></div>
 <div id="status"></div>
 <div class="help"><b>玩法</b><br>從海灘出發，穿越叢林、雪山，抵達火山口之巔！<br>・抓住岩壁攀爬會消耗<b style="color:#ffd04a">體力</b>，站在地面才會恢復。體力耗盡就會掉下去。<br>・摔傷（紅）、飢餓（橘）、寒冷（藍）會降低體力上限。吃莓果與蘑菇補充（蘑菇有好有壞）。<br>・叢林藤蔓濕滑；雪地會失溫；火山熔岩會上漲。<br>・營火是存檔點，倒下後會在最後到達的營火重生。<br><b>鍵盤</b>：方向鍵/WASD 移動、空白鍵 跳、Shift/K 抓</div>
</div>
<div id="room" class="ov hide">
 <h2 style="margin:0">邀請碼</h2><div id="rcode" style="font-size:40px;letter-spacing:8px;font-weight:800">-----</div>
 <button id="bCopy" class="alt">複製分享連結</button>
 <div id="pcount" style="font-weight:700">玩家 1/4</div><ul id="plist"></ul>
 <button id="bStart">開始遊戲</button><div id="wait" class="sub">等待房主開始…</div>
 <div id="rstatus" style="color:#ffd27a;font-size:14px"></div>
 <button id="bLeave" class="alt">離開</button>
</div>
<div id="end" class="ov hide">
 <h1 id="etitle" style="font-size:36px">登頂成功！</h1><p id="einfo"></p>
 <button id="bAgain">再玩一次</button><button id="bMenu" class="alt">回到主選單</button>
</div>
<script>
"use strict";
// ---------- setup ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=1,CW=0,CH=0;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);CW=innerWidth;CH=innerHeight;cv.width=CW*DPR|0;cv.height=CH*DPR|0}
addEventListener('resize',resize);resize();
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

const W=360,BL=1500,NB=4,TOP=-BL*NB;
const BIOMES=[
 {n:'海灘',rock:'#cfa86a',edge:'#efd49a',sky:['#7ec8f0','#f7e3b5']},
 {n:'叢林',rock:'#4f7a3a',edge:'#7fb34f',sky:['#5fae9a','#c9e8b0']},
 {n:'雪山',rock:'#8b98a8',edge:'#f4f8ff',sky:['#9fb4d6','#e9eef8']},
 {n:'火山',rock:'#4a3030',edge:'#8a4a32',sky:['#3a1d24','#d0603a']}];
const biomeAt=y=>Math.max(0,Math.min(NB-1,Math.floor(-y/BL)));
const COLORS=['#ff6b4a','#4ab3ff','#7de05a','#e07de0'];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- world ----------
let rects,foods,camps,eaten;
function genWorld(seed){
 const R=rng(seed);rects=[];foods=[];camps=[];eaten=new Set();
 rects.push({x:-60,y:0,w:W+120,h:400});
 rects.push({x:-60,y:TOP-600,w:60,h:-TOP+1000,side:1},{x:W,y:TOP-600,w:60,h:-TOP+1000,side:1});
 for(let b=1;b<NB;b++){const y=-b*BL;rects.push({x:70,y,w:220,h:16});camps.push({x:180,y,b})}
 let fid=0;
 for(let y=-60;y>TOP+70;y-=50+R()*22){
  if(camps.some(c=>Math.abs(c.y-y)<45))continue;
  const n=R()<.55?2:1;
  for(let i=0;i<n;i++){
   const w=36+R()*80,x=i?(R()<.5?R()*(W/2-w):W/2+R()*(W/2-w)):R()*(W-w);
   const r={x,y,w,h:14};rects.push(r);
   if(R()<.22)foods.push({id:fid++,x:x+w/2,y:y-7,k:R()<.6?'berry':'mush'});
  }
  if(R()<.3){const h=80+R()*90;rects.push({x:20+R()*(W-60),y:y-h,w:18,h})}
 }
 rects.push({x:110,y:TOP,w:140,h:24,peak:1});
}
function hit(x,y,w,h){for(const r of rects)if(x<r.x+r.w&&x+w>r.x&&y<r.y+r.h&&y+h>r.y)return r;return null}

// ---------- state ----------
const PW=12,PH=18;
let P,mode='menu',seed=1,t0=0,elapsed=0,lava=1e9,lavaOn=false,checkpoint,parts=[],toastT=0,shake=0,camY=0,winner='';
function newPlayer(){return{x:W/2-6,y:-PH-1,vx:0,vy:0,ground:false,cling:0,stam:100,inj:0,hun:0,cold:0,down:false,downT:0,face:1,camp:-1}}
const maxS=p=>Math.max(8,100-p.inj-p.hun-p.cold);
function toast(s){$('toast').textContent=s;toastT=2.5}
function puff(x,y,c,n,sp=80){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*sp,vy:-Math.random()*sp,l:.6+Math.random()*.4,c})}

// ---------- input ----------
const K={},prev={};
const km={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',ShiftLeft:'grab',ShiftRight:'grab',KeyK:'grab'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=km[e.code];if(k){K[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=km[e.code];if(k)K[k]=0});
document.querySelectorAll('.b').forEach(b=>{const k=b.dataset.k;
 const on=e=>{e.preventDefault();K[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
 const off=e=>{K[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off))});
const pressed=k=>K[k]&&!prev[k];

// ---------- game flow ----------
function startGame(s){
 seed=s;genWorld(seed);P=newPlayer();checkpoint={x:P.x,y:P.y};lava=1e9;lavaOn=false;parts=[];
 t0=performance.now();elapsed=0;camY=P.y-200;mode='play';
 for(const id in remotes)Object.assign(remotes[id],{x:P.x,y:P.y,dx:P.x,dy:P.y});
 ['menu','room','end'].forEach(i=>$(i).classList.add('hide'));$('ctl').classList.remove('hide');
 hint=null;bestY=P.y;progT=0;toast('從海灘出發！目標：山頂');
}
function down(){if(P.down)return;P.down=true;P.cling=0;P.downT=2.5;shake=.4;puff(P.x+6,P.y+9,'#fff',14);toast('倒下了…即將在營火重生')}
function respawn(){Object.assign(P,{x:checkpoint.x,y:checkpoint.y,vx:0,vy:0,down:false,inj:P.inj*.5,cold:0});P.stam=maxS(P);toast('於營火處重生')}
function win(name,time){if(mode!=='play')return;mode='end';$('ctl').classList.add('hide');
 $('etitle').textContent='登頂成功！';$('einfo').innerHTML=(net?`<b>${esc(name)}</b> 率先登頂！<br>`:'')+`用時 ${fmt(time)}`;
 $('end').classList.remove('hide');$('bAgain').classList.toggle('hide',net&&!isHost)}
const fmt=t=>`${Math.floor(t/60)}分${String(Math.floor(t%60)).padStart(2,'0')}秒`;
const esc=s=>String(s).replace(/[<>&"]/g,c=>'&#'+c.charCodeAt(0)+';');

function touchWall(d){return hit(d<0?P.x-2:P.x+PW,P.y+2,2,PH-4)}
function update(dt){
 elapsed=(performance.now()-t0)/1000;
 const b=biomeAt(P.y);
 // hunger & cold
 P.hun=Math.min(45,P.hun+dt*.35);
 const nearCamp=camps.find(c=>Math.abs(c.x-(P.x+6))<60&&Math.abs(c.y-(P.y+PH))<40);
 if(b===2&&!nearCamp)P.cold=Math.min(40,P.cold+dt*1.6);else P.cold=Math.max(0,P.cold-dt*(nearCamp?20:3));
 if(nearCamp&&P.camp!==nearCamp.b){P.camp=nearCamp.b;checkpoint={x:nearCamp.x-6,y:nearCamp.y-PH-1};toast(`營火！進入${BIOMES[nearCamp.b].n}（已存檔）`);puff(nearCamp.x,nearCamp.y-6,'#ffb347',20)}
 if(P.y<bestY-10){bestY=P.y;progT=elapsed}
 if(hint&&(P.y<hint.sy-30||P.y<=hint.ty-PH+2&&Math.abs(P.x+6-hint.tx)<30))hint=null;
 if(!P.down&&!hint&&elapsed-progT>9){makeHint();progT=elapsed}
 if(P.down){hint=null;P.downT-=dt;P.vx=0;P.vy=Math.min(900,P.vy+1000*dt);moveY(dt);if(P.downT<=0)respawn();return}
 const ax=(K.right?1:0)-(K.left?1:0);if(ax)P.face=ax;
 const wl=touchWall(-1),wr=touchWall(1),wall=wl||wr;
 const MS=maxS(P);
 if(K.grab&&wall&&P.stam>0){if(!P.cling)P.cling=wl?-1:1}else P.cling=0;
 if(P.cling){
  const up=K.up?1:0,dn=K.down?1:0,slip=b===1?1.6:1;
  P.vx=0;P.vy=-up*85+dn*110+(b===1&&!up?30:0);
  P.stam-=(7+up*13)*slip*dt*(b===2?1.2:1);
  if(pressed('jump')&&P.stam>4){P.vy=-340;P.vx=-P.cling*170;P.stam-=12;P.cling=0;puff(P.x+6,P.y+9,'#ddd',5)}
  if(P.stam<=0){P.stam=0;P.cling=0;toast('體力耗盡！')}
 }else{
  P.vx+=(ax*140-P.vx)*Math.min(1,dt*(P.ground?14:5));
  if(pressed('jump')&&P.ground&&P.stam>3){P.vy=-370;P.stam-=8;P.ground=false;puff(P.x+6,P.y+PH,'#eee',5)}
  P.vy=Math.min(900,P.vy+1000*dt);
 }
 if(P.ground&&!P.cling)P.stam+=40*dt;
 P.stam=Math.max(0,Math.min(P.stam,MS));
 P.x+=P.vx*dt;const rx=hit(P.x,P.y,PW,PH);if(rx){P.x=P.vx>0?rx.x-PW:rx.x+rx.w;P.vx=0}
 const vy=P.vy;moveY(dt);
 if(P.ground&&vy>640){P.inj=Math.min(95,P.inj+(vy-640)*.09);shake=.25;puff(P.x+6,P.y+PH,'#c33',10);toast('摔傷了！');if(P.inj>=85)down()}
 // food
 for(const f of foods)if(!eaten.has(f.id)&&Math.abs(f.x-(P.x+6))<14&&Math.abs(f.y-(P.y+9))<16){eat(f.id,true)}
 // lava
 if(b===3&&!lavaOn){lavaOn=true;if(!net||isHost)lava=-3*BL+250;toast('熔岩開始上漲！快爬！')}
 if(lavaOn&&(!net||isHost))lava-=dt*7;
 if(P.y+PH>lava+4){down();P.downT=Math.min(P.downT,1.5)}
 if(P.ground&&P.y+PH<=TOP+1){const t=elapsed;if(net)send({t:'win',n:myName,tm:t});win(myName,t)}
}
function moveY(dt){P.y+=P.vy*dt;P.ground=false;const r=hit(P.x,P.y,PW,PH);if(r){if(P.vy>0){P.y=r.y-PH;P.ground=true}else P.y=r.y+r.h;P.vy=0}}
function eat(id,mine){if(eaten.has(id))return;eaten.add(id);const f=foods.find(f=>f.id===id);if(!f)return;
 if(mine){
  if(f.k==='berry'){P.hun=Math.max(0,P.hun-22);P.stam+=15;toast('莓果！飢餓減少');puff(f.x,f.y,'#e33',8)}
  else if(Math.random()<.6){P.inj=Math.max(0,P.inj-20);P.hun=Math.max(0,P.hun-10);P.stam=maxS(P);toast('好蘑菇！傷勢恢復、體力全滿');puff(f.x,f.y,'#6f6',10)}
  else{P.inj=Math.min(80,P.inj+15);P.stam*=.5;toast('毒蘑菇！頭好暈…');puff(f.x,f.y,'#a4f',10)}
  if(net)send({t:'eat',id});
 }}


// ---------- hint ----------
let hint=null,bestY=0,progT=0;
function makeHint(){
 const feet=P.y+PH,cx=P.x+6;let best=null,bs=-1e9;
 for(const r of rects){if(r.side||r.y>=0&&r.h>300)continue;
  const up=feet-r.y;if(up<8||up>260)continue;
  const tx=Math.max(r.x+6,Math.min(r.x+r.w-6,cx)),dx=Math.abs(tx-cx);if(dx>200)continue;
  if(hit(tx-6,r.y-PH-1,PW,PH))continue;
  const reach=up<=64&&dx<=150,sc=(reach?1000:0)+up-dx*.4;
  if(sc>bs){bs=sc;best={r,tx,ty:r.y,reach,dx:tx-cx}}}
 const walls=rects.filter(r=>r.h>=60&&r.y<P.y&&r.y+r.h>P.y-10);
 let w=null,wd=1e9;for(const r of walls){const ex=r.x+r.w<cx?r.x+r.w:r.x>cx?r.x:null;if(ex===null)continue;const d=Math.abs(ex-cx);if(d<wd){wd=d;w={r,ex}}}
 if(P.cling&&best&&!best.reach&&best.dx*-P.cling>0){hint={r:best.r,tx:best.tx,ty:best.ty,text:'蹬牆跳：抓牆時按跳',wj:1,sy:P.y};return}
 if(best&&best.reach){hint={r:best.r,tx:best.tx,ty:best.ty,text:Math.abs(best.dx)<20?'往上跳到這個平台':best.dx<0?'往左跳到這個平台':'往右跳到這個平台',sy:P.y};return}
 if(w){const top=Math.max(w.r.y,P.y-120);hint={r:w.r,wall:1,tx:w.ex,ty:top,text:(wd>8?(w.ex<cx?'往左走，':'往右走，'):'')+'按住「抓」爬上這面岩壁',sy:P.y};return}
 if(best){hint={r:best.r,tx:best.tx,ty:best.ty,text:'往這個方向前進',sy:P.y};return}
 toast('附近找不到路線，試試兩側岩壁');
}
// ---------- render ----------
function render(dt){
 const s=CW/W*DPR,vh=CH/(CW/W);
 const target=P?P.y-vh*.55:0;camY+=(target-camY)*Math.min(1,dt*6);
 const b=P?biomeAt(P.y):0,B=BIOMES[b];
 const g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,B.sky[0]);g.addColorStop(1,B.sky[1]);
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
 if(!P)return;
 // parallax peaks
 ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.moveTo(0,cv.height);
 for(let i=0;i<=8;i++)ctx.lineTo(i*cv.width/8,cv.height*.5+Math.sin(i*1.7+camY*.0005)*cv.height*.15);ctx.lineTo(cv.width,cv.height);ctx.fill();
 const sx=shake>0?(Math.random()-.5)*6:0;
 ctx.setTransform(s,0,0,s,sx*DPR,-camY*s);
 const y0=camY-40,y1=camY+vh+40;
 for(const r of rects){if(r.y>y1||r.y+r.h<y0)continue;const rb=BIOMES[biomeAt(r.y)];
  ctx.fillStyle=r.peak?'#eee':rb.rock;ctx.fillRect(r.x,Math.max(r.y,y0),r.w,Math.min(r.y+r.h,y1)-Math.max(r.y,y0));
  if(!r.side){ctx.fillStyle=rb.edge;ctx.fillRect(r.x,r.y,r.w,4)}
  if(biomeAt(r.y)===1&&r.h<200){ctx.strokeStyle='#2e5a22';ctx.lineWidth=2;ctx.beginPath();for(let x=r.x+6;x<r.x+r.w;x+=14){ctx.moveTo(x,r.y+r.h);ctx.quadraticCurveTo(x+4,r.y+r.h+8,x,r.y+r.h+16)}ctx.stroke()}}
 // peak flag
 ctx.fillStyle='#555';ctx.fillRect(178,TOP-50,3,50);ctx.fillStyle='#f2a33a';ctx.beginPath();ctx.moveTo(181,TOP-50);ctx.lineTo(205,TOP-42);ctx.lineTo(181,TOP-34);ctx.fill();
 const tt=performance.now()/1000;
 for(const c of camps){ctx.fillStyle='#6b3e1f';ctx.fillRect(c.x-10,c.y-4,20,4);
  for(let i=0;i<3;i++){ctx.fillStyle=['#ff4a1c','#ff9a1c','#ffe14a'][i];const h=14-i*4+Math.sin(tt*12+i)*2;ctx.beginPath();ctx.moveTo(c.x-6+i*2,c.y-4);ctx.lineTo(c.x,c.y-4-h);ctx.lineTo(c.x+6-i*2,c.y-4);ctx.fill()}}
 for(const f of foods){if(eaten.has(f.id)||f.y<y0||f.y>y1)continue;
  if(f.k==='berry'){ctx.fillStyle='#d6243a';for(const[a,c]of[[-3,0],[3,0],[0,-4]]){ctx.beginPath();ctx.arc(f.x+a,f.y+c+2,3,0,7);ctx.fill()}}
  else{ctx.fillStyle='#eee';ctx.fillRect(f.x-1.5,f.y,3,6);ctx.fillStyle='#b5482a';ctx.beginPath();ctx.arc(f.x,f.y+1,6,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(f.x-3,f.y-3,2,2)}}
 if(lava<y1){ctx.fillStyle='#ff5a1a';ctx.fillRect(-60,lava,W+120,y1-lava+50);ctx.fillStyle='#ffc23a';for(let x=0;x<W;x+=20)ctx.fillRect(x,lava+Math.sin(tt*3+x)*2,10,3)}
 for(const id in remotes){const r=remotes[id];drawP(r.dx,r.dy,r.col,r.f,r.c,r.d,r.n)}
 drawP(P.x,P.y,myColor,P.face,P.cling,P.down,net?myName:'');
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,2.5,2.5)}ctx.globalAlpha=1;
 if(b===2){ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<40;i++){const x=(i*97+tt*20*(1+i%3))%W,y=camY+((i*53+tt*40*(1+i%2))%vh);ctx.fillRect(x,y,2,2)}}
 if(hint){const pu=.5+.5*Math.sin(tt*6);ctx.strokeStyle=`rgba(255,240,80,${.5+pu*.5})`;ctx.lineWidth=2+pu;ctx.strokeRect(hint.r.x-2,hint.r.y-2,hint.r.w+4,Math.min(hint.r.h,hint.wall?hint.r.h:14)+4);
  const x0=P.x+6,y0=P.y+9,dx=hint.tx-x0,dy=hint.ty-y0,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,len=Math.min(L-6,40+pu*10);
  if(len>8){ctx.strokeStyle='#ffe94a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x0+ux*12,y0+uy*12);const ex=x0+ux*(12+len),ey=y0+uy*(12+len);ctx.lineTo(ex,ey);ctx.stroke();
   ctx.fillStyle='#ffe94a';ctx.beginPath();ctx.moveTo(ex+ux*7,ey+uy*7);ctx.lineTo(ex-uy*5,ey+ux*5);ctx.lineTo(ex+uy*5,ey-ux*5);ctx.fill()}}
 hud();
}
function drawP(x,y,col,f,cl,dn,name){
 ctx.save();ctx.translate(x+6,y+PH);if(dn)ctx.rotate(Math.PI/2*(f||1));
 ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(-6,-PH,12,PH,5):ctx.rect(-6,-PH,12,PH);ctx.fill();
 ctx.fillStyle='#ffe0bd';ctx.fillRect(-4+(f>0?2:0),-PH+3,6,5);ctx.fillStyle='#000';ctx.fillRect(f>0?2:-2,-PH+4,1.5,2);
 ctx.fillStyle='#5a3a22';ctx.fillRect(f>0?-9:5,-PH+6,4,8);
 if(cl){ctx.fillStyle=col;ctx.fillRect(cl>0?5:-9,-PH+1,4,3)}
 ctx.restore();
 if(name){ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(name,x+6.5,y-4.5);ctx.fillStyle='#fff';ctx.fillText(name,x+6,y-5)}
}
function hud(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 const bw=Math.min(220,CW-140),x=12,y=14+(window.visualViewport?0:0);
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x-4,y-4,bw+8,52);
 ctx.fillStyle='#333';ctx.fillRect(x,y+14,bw,14);
 const u=bw/100;let ex=x+bw;
 for(const[v,c]of[[P.inj,'#d63030'],[P.hun,'#e08a2a'],[P.cold,'#4ab3ff']]){ex-=v*u;ctx.fillStyle=c;ctx.fillRect(ex,y+14,v*u,14)}
 ctx.fillStyle=P.stam<20?'#ff7a3a':'#ffd04a';ctx.fillRect(x,y+14,P.stam*u,14);
 ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText('體力',x,y+9);
 ctx.font='11px sans-serif';ctx.fillText(`傷 ${P.inj|0}  飢 ${P.hun|0}  寒 ${P.cold|0}`,x+40,y+9);
 ctx.fillText(BIOMES[biomeAt(P.y)].n+(net?`  · ${Object.keys(remotes).length+1}人`:''),x,y+42);
 ctx.textAlign='right';ctx.font='bold 18px sans-serif';ctx.fillText(`${Math.max(0,-P.y/4)|0} m`,CW-12,y+14);
 ctx.font='12px sans-serif';ctx.fillText(`/ ${-TOP/4} m　${fmt(elapsed)}`,CW-12,y+32);
 if(P.down){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillText(`重生中… ${Math.ceil(P.downT)}`,CW/2,CH*.4)}
 if(hint){const s2=CW/W,syT=(hint.ty-camY)*s2;let tip=hint.text;if(P.stam<maxS(P)*.3&&!hint.wj)tip='體力不足，先站在地面回體力';
  ctx.textAlign='center';ctx.font='bold 15px sans-serif';const tw=ctx.measureText(tip).width+20;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(CW/2-tw/2,124,tw,26);ctx.fillStyle='#ffe94a';ctx.fillText(tip,CW/2,142);
  if(syT<60||syT>CH-215){const ey=syT<60?166:CH-225,ex=Math.max(20,Math.min(CW-20,hint.tx*s2)),d=syT<60?-1:1,pu=Math.sin(performance.now()/150)*4;ctx.fillStyle='#ffe94a';ctx.beginPath();ctx.moveTo(ex,ey+d*(14+pu));ctx.lineTo(ex-12,ey+pu*d);ctx.lineTo(ex+12,ey+pu*d);ctx.fill()}}
 if(net){const L=lobbyList.length?lobbyList:[{id:myId,n:myName,col:myColor}],pw=150,px=CW-pw-8,py=y+40;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(px,py,pw,20+L.length*15);ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';
  ctx.fillText(`房 ${roomCode} · 人數 ${L.length}/4`,px+6,py+14);
  L.forEach((p,i)=>{const me=p.id===myId,r=remotes[p.id],yy=py+29+i*15;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(px+10,yy-4,4,0,7);ctx.fill();
   ctx.fillStyle='#fff';ctx.font='10px sans-serif';const alt=me?-P.y:r?-r.y:0;
   ctx.fillText(`${p.n} #${p.h?roomCode:sid(p.id)}${me?'(你)':''} ${Math.max(0,alt/4)|0}m${(me?P.down:r&&r.d)?' 重生中':''}`,px+18,yy)})}
}

// ---------- loop ----------
let last=performance.now(),netT=0;
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 if(mode==='play'&&P)update(dt);
 for(const k in K)prev[k]=K[k];
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 for(const id in remotes){const r=remotes[id];const a=Math.min(1,dt*12);r.dx+=(r.x-r.dx)*a;r.dy+=(r.y-r.dy)*a}
 shake-=dt;if(toastT>0&&(toastT-=dt)<=0)$('toast').textContent='';
 if(net&&mode==='play'&&(netT+=dt)>.055){netT=0;netTick()}
 if(P)render(dt);else{ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#24476b';ctx.fillRect(0,0,cv.width,cv.height)}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- networking (PeerJS, optional) ----------
let peer=null,net=false,isHost=false,myId='me',hostConn=null,conns={},lobby={},remotes={},myName='玩家',myColor=COLORS[0],roomCode='';
const PFX='panjian-peak2d-v1-';let lobbyList=[];const sid=id=>String(id).replace(PFX,'').replace(/[^a-z0-9]/gi,'').slice(-4).toUpperCase();
function loadPeer(){return new Promise((ok,no)=>{if(window.Peer)return ok();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=()=>no(new Error('無法載入連線函式庫'));document.head.appendChild(s)})}
const st=t=>{$('status').textContent=t;$('rstatus').textContent=t};
function getNick(){myName=($('nick').value.trim()||'玩家'+(Math.random()*90+10|0)).slice(0,8);try{localStorage.nick=myName}catch(_){}}
function send(d){if(!net)return;if(isHost){for(const id in conns)conns[id].open&&conns[id].send(d);hostHandle(myId,d,true)}else if(hostConn&&hostConn.open)hostConn.send(d)}
function bcLobby(){const pl=Object.entries(lobby).map(([id,v])=>({id,...v}));for(const id in conns)conns[id].open&&conns[id].send({t:'lobby',pl});showLobby(pl)}
function showLobby(pl){lobbyList=pl;$('pcount').textContent=`玩家 ${pl.length}/4`;$('plist').innerHTML=pl.map(p=>`<li style="border-left:6px solid ${p.col}">${esc(p.n)} <small style="opacity:.7">ID #${p.h?roomCode:sid(p.id)}</small>${p.h?' 👑房主':''}${p.id===myId?'（你）':''}</li>`).join('');
 for(const p of pl)if(p.id===myId)myColor=p.col}
async function host(){
 getNick();st('連線中…');try{await loadPeer()}catch(e){st(e.message);return}
 roomCode=String(Math.random()*10000|0).padStart(4,'0');
 peer=new Peer(PFX+roomCode);
 peer.on('open',id=>{myId=id;isHost=true;net=true;lobby={[id]:{n:myName,col:COLORS[0],h:1}};myColor=COLORS[0];openRoom();bcLobby()});
 peer.on('connection',c=>{
  c.on('data',d=>hostHandle(c.peer,d,false,c));
  c.on('close',()=>{const n=lobby[c.peer]&&lobby[c.peer].n;delete conns[c.peer];delete lobby[c.peer];delete remotes[c.peer];bcLobby();if(n)toast(`${n} 離線了`)});
 });
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();host()}else st('連線錯誤：'+e.type)});
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(_){}});
}
function hostHandle(from,d,self,cc){
 if(self){if(d.t==='win')win(d.n,d.tm);return}
 const c=cc||conns[from];
 if(d.t==='hello'){
  if(Object.keys(lobby).length>=4||mode!=='room'){c.send({t:'full'});setTimeout(()=>c.close(),300);return}
  conns[from]=c;const used=Object.values(lobby).map(v=>v.col);lobby[from]={n:String(d.n).slice(0,8),col:COLORS.find(x=>!used.includes(x))};bcLobby();
 }else if(d.t==='st'){if(lobby[from])remotes[from]=Object.assign(remotes[from]||{dx:d.x,dy:d.y},d,{n:lobby[from].n,col:lobby[from].col})}
 else if(d.t==='eat'){eaten.add(d.id);for(const id in conns)conns[id].send({t:'eaten',id:d.id})}
 else if(d.t==='win'){for(const id in conns)conns[id].send(d);win(d.n,d.tm)}
}
function netTick(){
 const me={x:+P.x.toFixed(1),y:+P.y.toFixed(1),f:P.face,c:P.cling,d:P.down?1:0};
 if(isHost){const ps={[myId]:{...me,n:myName,col:myColor}};for(const id in remotes){const r=remotes[id];ps[id]={x:r.x,y:r.y,f:r.f,c:r.c,d:r.d,n:r.n,col:r.col}}
  for(const id in conns)conns[id].open&&conns[id].send({t:'ps',ps,lava,lo:lavaOn})}
 else hostConn&&hostConn.open&&hostConn.send({t:'st',...me});
}
async function join(code){
 getNick();code=code.replace(/\D/g,'');if(code.length!==4){st('請輸入 4 位數邀請碼');return}
 st('連線中…');try{await loadPeer()}catch(e){st(e.message);return}
 peer=new Peer();roomCode=code;
 peer.on('open',id=>{myId=id;hostConn=peer.connect(PFX+code,{reliable:true});
  hostConn.on('open',()=>{net=true;isHost=false;hostConn.send({t:'hello',n:myName});openRoom()});
  hostConn.on('data',clientHandle);
  hostConn.on('close',()=>{if(net){net=false;remotes={};toast('與房主斷線，改為單人模式');st('與房主斷線');if(mode==='room')leave()}});
 });
 peer.on('error',e=>st(e.type==='peer-unavailable'?'找不到房間，請確認代碼':'連線錯誤：'+e.type));
}
function clientHandle(d){
 if(d.t==='lobby')showLobby(d.pl);
 else if(d.t==='full'){st('房間已滿或已開始');net=false;leave()}
 else if(d.t==='start'){eatenPending=null;startGame(d.seed)}
 else if(d.t==='ps'){if(mode!=='play')return;lava=d.lava;if(d.lo)lavaOn=true;
  for(const id in d.ps){if(id===myId)continue;const v=d.ps[id];remotes[id]=Object.assign(remotes[id]||{dx:v.x,dy:v.y},v)}
  for(const id in remotes)if(!d.ps[id])delete remotes[id]}
 else if(d.t==='eaten'||d.t==='eat')eaten.add(d.id);
 else if(d.t==='win')win(d.n,d.tm);
}
let eatenPending=null;
function openRoom(){mode='room';$('menu').classList.add('hide');$('end').classList.add('hide');$('room').classList.remove('hide');$('rcode').textContent=roomCode;
 $('bStart').classList.toggle('hide',!isHost);$('wait').classList.toggle('hide',isHost);st('')}
function leave(){try{peer&&peer.destroy()}catch(_){}peer=null;net=false;isHost=false;conns={};lobby={};lobbyList=[];remotes={};hostConn=null;mode='menu';P=null;
 ['room','end'].forEach(i=>$(i).classList.add('hide'));$('ctl').classList.add('hide');$('menu').classList.remove('hide')}
function hostStart(){const s=Math.random()*1e9|0;for(const id in conns)conns[id].send({t:'start',seed:s});startGame(s)}

// ---------- menu wiring ----------
try{if(localStorage.nick)$('nick').value=localStorage.nick}catch(_){}
const qp=new URLSearchParams(location.search).get('room');if(qp){$('code').value=qp.replace(/\D/g,'').slice(0,4);st('已帶入房間代碼，輸入暱稱後按「加入房間」')}
$('bSolo').onclick=()=>{getNick();net=false;myColor=COLORS[0];startGame(Math.random()*1e9|0)};
$('bHost').onclick=host;
$('code').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)};
$('hintb').onclick=()=>{if(mode==='play'&&P&&!P.down){makeHint();progT=elapsed}};
$('bJoin').onclick=()=>join($('code').value);
$('bStart').onclick=hostStart;
$('bLeave').onclick=leave;
$('bCopy').onclick=async()=>{const u=location.origin+location.pathname+'?room='+roomCode;
 try{await navigator.clipboard.writeText(u);st('已複製：'+u)}catch(_){prompt('複製此連結',u)}};
$('bAgain').onclick=()=>{if(net&&isHost)hostStart();else if(!net)startGame(Math.random()*1e9|0)};
$('bMenu').onclick=leave;
</script></body></html>
