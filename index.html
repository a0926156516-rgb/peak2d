<script>
"use strict";
// ---------- setup ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=1,CW=0,CH=0;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);CW=innerWidth;CH=innerHeight;cv.width=CW*DPR|0;cv.height=CH*DPR|0}
addEventListener('resize',resize);resize();
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

const W=360,NLV=50;let BL=1500,NB=4,TOP=-6000,LV=1,DIFF=0;
function levelCfg(lv){LV=Math.max(1,Math.min(NLV,lv|0));DIFF=(LV-1)/(NLV-1);const H=1200+DIFF*5200;NB=LV<4?2:LV<13?3:4;BL=Math.round(H/NB/4)*4;TOP=-BL*NB}
const BIOMES=[
 {n:'海灘',rock:'#cfa86a',edge:'#efd49a',sky:['#7ec8f0','#f7e3b5']},
 {n:'叢林',rock:'#4f7a3a',edge:'#7fb34f',sky:['#5fae9a','#c9e8b0']},
 {n:'雪山',rock:'#8b98a8',edge:'#f4f8ff',sky:['#9fb4d6','#e9eef8']},
 {n:'火山',rock:'#4a3030',edge:'#8a4a32',sky:['#3a1d24','#d0603a']}];
const biomeAt=y=>Math.max(0,Math.min(NB-1,Math.floor(-y/BL)));
// Character colors: swap hex values here. Order = colorIndex (server uses indexes 0..3).
const COLORS=['#e8483b','#2f8fe0','#3fb85a','#f2b630'];
const COLOR_NAMES=['紅','藍','綠','黃'];
let myGender='m',myCI=0,serverRoster=false;
try{if(localStorage.gender==='f')myGender='f';const c=+localStorage.color;if(c>=0&&c<COLORS.length)myCI=c}catch(_){}
const saveChar=()=>{try{localStorage.gender=myGender;localStorage.color=myCI}catch(_){}};
const gSym=g=>g==='f'?'♀':'♂';
// ---------- character art: sprite sheets from characters/manifest.json, procedural fallback ----------
const SPR={ok:false,m:null,sheets:{},tint:{}};
(async()=>{try{const r=await fetch('characters/manifest.json',{cache:'no-cache'});if(!r.ok)return;const m=await r.json();
 const load=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='characters/'+src});
 for(const g of['male','female']){const d=m.sheets&&m.sheets[g];if(!d)continue;
  SPR.sheets[g]=Array.isArray(d)?{perColor:await Promise.all(d.map(load))}:d.colored?{perColor:await Promise.all(d.colored.map(load)),scale:d.scale,name:d.name}:{base:await load(d.base||d),mask:d.mask?await load(d.mask):null,scale:d.scale,name:d.name}}
 SPR.m=m;SPR.ok=!!(SPR.sheets.male&&SPR.sheets.female);if(SPR.ok)renderPickers()}catch(e){console.info('no character sprites, using procedural',e&&e.message)}})();
function tintedMask(g,ci){const k=g+ci;if(SPR.tint[k])return SPR.tint[k];const mk=SPR.sheets[g].mask,c=document.createElement('canvas');c.width=mk.width;c.height=mk.height;
 const x=c.getContext('2d');x.drawImage(SPR.sheets[g].base,0,0);x.globalCompositeOperation='multiply';x.fillStyle=COLORS[ci];x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-in';x.drawImage(mk,0,0);return SPR.tint[k]=c}
// Draws a character with feet at (0,0) in the current transform. anim: idle|walk|jump|climb|fall; frame: running counter (seconds); facing: 1|-1
function drawCharacter(ctx,gender,colorIndex,anim,frame,facing){
 const g=gender==='f'?'female':'male',ci=colorIndex|0;
 if(SPR.ok){const m=SPR.m,a=(m.anims&&(m.anims[anim]||m.anims.idle))||{row:0,frames:1,fps:1},fw=m.frameW,fh=m.frameH,an=m.anchor||[fw/2,fh];
  const sh=SPR.sheets[g],sc=sh.scale||m.scale||1,fi=a.hold&&false?0:Math.floor(frame*(a.fps||8))%(a.frames||1),sx=fi*fw,sy=(a.row||0)*fh;
  ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';if(facing<0!==(m.facesLeft===true))ctx.scale(-1,1);
  const dr=img=>ctx.drawImage(img,sx,sy,fw,fh,-an[0]*sc,-an[1]*sc,fw*sc,fh*sc);
  if(sh.perColor)dr(sh.perColor[ci]||sh.perColor[0]);else{dr(sh.base);if(sh.mask)dr(tintedMask(g,ci))}
  ctx.restore();return}
 // procedural fallback (approx 12x18 px body)
 const col=COLORS[ci]||COLORS[0],f=facing<0?-1:1,t=frame;ctx.save();ctx.scale(f,1);
 const sw=anim==='walk'?Math.sin(t*14)*3:anim==='climb'?Math.sin(t*10)*2:0;
 // legs
 ctx.fillStyle='#3a3046';ctx.fillRect(-4,-6,3,6+(anim==='jump'?-2:0)+(sw>0?0:-1));ctx.fillRect(1,-6,3,6+(sw<0?0:-1));
 // backpack
 ctx.fillStyle='#5a3a22';ctx.fillRect(-9,-15,4,8);
 // body
 ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(-5,-15,10,10,3):ctx.rect(-5,-15,10,10);ctx.fill();
 if(gender==='f'){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-6,-5);ctx.lineTo(6,-5);ctx.lineTo(4,-9);ctx.lineTo(-4,-9);ctx.fill()}
 // arm
 const up=anim==='climb'||anim==='jump';ctx.fillStyle=col;ctx.fillRect(3,up?-20+sw:-13+sw*.5,3,up?6:6);ctx.fillStyle='#ffe0bd';ctx.fillRect(3,up?-21+sw:-8+sw*.5,3,2);
 // head
 ctx.fillStyle='#ffe0bd';ctx.beginPath();ctx.arc(0,-19,4.5,0,7);ctx.fill();
 ctx.fillStyle='#000';ctx.fillRect(1.5,-20,1.4,2);
 // hair
 if(gender==='f'){ctx.fillStyle='#6b3a1e';ctx.beginPath();ctx.arc(0,-20,4.8,Math.PI*1.05,Math.PI*2.05);ctx.fill();ctx.fillRect(-5,-21,2.5,7);
  const pt=Math.sin(t*8)*1.5*(anim==='walk'?1:0.3);ctx.beginPath();ctx.ellipse(-6.5,-17+pt,2,4.5,0.3,0,7);ctx.fill();ctx.fillStyle=col;ctx.fillRect(-6,-21,2,2)}
 else{ctx.fillStyle='#2b2118';ctx.beginPath();ctx.arc(0,-20.5,4.6,Math.PI*1.02,Math.PI*1.98);ctx.fill();ctx.fillRect(-4.6,-21,2,2.5)}
 ctx.restore()}
function animOf(p){if(p.down)return'fall';if(p.cling)return'climb';if(!p.ground)return p.vy<0?'jump':'fall';return Math.abs(p.vx)>15?'walk':'idle'}
const ANIMS=['idle','walk','jump','climb','fall'];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- world ----------
let rects,foods,camps,eaten;
function genWorld(lv,sd,tries=0){levelCfg(lv);
 const R=rng(sd!=null?sd:LV*7919+104729);rects=[];foods=[];camps=[];eaten=new Set();
 rects.push({x:-60,y:0,w:W+120,h:400});
 rects.push({x:-60,y:TOP-800,w:60,h:-TOP+1200,side:1},{x:W,y:TOP-800,w:60,h:-TOP+1200,side:1});
 for(let b=1;b<NB;b++)camps.push({x:180,y:-b*BL,b,k:b});
 let fid=0;const peakR={x:110,y:TOP,w:140,h:14,peak:1};
 // ---- critical path: every ledge is reachable from the previous one with a safety margin
 // rise <= 48px (~70% of the 68px max jump), side gap <= 24px, and no path ledge hangs within 90px above another's take-off area
 const rmin=26+DIFF*14,gmax=10+DIFF*14,wmax=112-DIFF*52,path=[{x:W/2-30,y:0,w:60}];let side=R()<.5?-1:1;
 const clear=(r)=>{for(let k=path.length-2;k>=Math.max(0,path.length-6);k--){const q=path[k];if(Math.abs(q.y-r.y)<89&&r.x<q.x+q.w+16&&r.x+r.w>q.x-16)return false}return true};
 const place=(y,w0,wmin,h,extra)=>{const prev=path[path.length-1];let fb=null;
  for(let t=0;t<14;t++){const sd2=t<7?side:-side,g=6+R()*gmax;let w=w0;
   let x=sd2>0?prev.x+prev.w+g:prev.x-g-w;if(x<0){w+=x;x=0}if(x+w>W)w=W-x;
   if(w<wmin)continue;const r=Object.assign({x,y,w,h},extra);if(!fb)fb=r;if(clear(r)){side=sd2;return r}}
  for(let G=24;G<=56;G+=4)for(const sd2 of[side,-side])for(let w=w0;w>=wmin;w-=8){// turn: wider gap so the new ledge clears older take-off spots
   const x=sd2>0?prev.x+prev.w+G:prev.x-G-w;if(x<0||x+w>W)continue;const r=Object.assign({x,y:extra.peak||extra.camp?y:Math.max(y,prev.y-36),w,h},extra);if(clear(r)){side=sd2;return r}}
  if(fb)return fb;const w=wmin,x=side>0?Math.min(W-w,prev.x+prev.w+6):Math.max(0,prev.x-6-w);return Object.assign({x,y,w,h},extra)};
 const miles=[...camps.map(c=>({y:c.y,c})),{y:TOP,peak:1}];let mi=0,turn=false;
 for(let guard=0;guard<2000&&mi<miles.length;guard++){const prev=path[path.length-1],m=miles[mi];
  const rise=turn?45:rmin+R()*6,ny=prev.y-rise;
  if(ny<=m.y+20){turn=false;// milestone (campfire / summit) sits wherever the path arrives near its nominal height
   if(m.peak){const r=place(ny,140,70,14,{peak:1});Object.assign(peakR,r);TOP=peakR.y;path.push(peakR);mi++;break}
   const r=place(ny,120,64,16,{camp:1,path:1});rects.push(r);m.c.x=r.x+r.w/2;m.c.y=r.y;path.push(r);mi++;continue}
  const wmn=60-20*DIFF,r=place(ny,wmn+R()*Math.max(0,wmax-wmn),40,14,{path:1});rects.push(r);path.push(r);
  // approaching a wall: this rise and the turn's rise are both 45px so the turn ledge clears the old take-off spot
  const room=side>0?W-r.x-r.w:r.x,need=r.y-rmin-6<=m.y+20?(m.peak?84:78):52;turn=false;if(room<need){r.y=prev.y-45;turn=true}
  if(R()<.22)foods.push({id:fid++,x:r.x+r.w/2,y:r.y-7,k:R()<.6?'berry':'mush'});
  if(R()<.75-DIFF*.4){const w=40+R()*60,x=R()*(W-w);rects.push({x,y:r.y,w,h:14,ex:1});if(R()<.25)foods.push({id:fid++,x:x+w/2,y:r.y-7,k:R()<.5?'berry':'mush'})}
  if(R()<.1+DIFF*.25){const h=80+R()*90,px=20+R()*(W-60);rects.push({x:px,y:r.y-h,w:18,h,pil:1})}
 }
 // side ledges / pillars must stay out of the critical-path corridors
 for(let i=rects.length-1;i>=0;i--){const r=rects[i];if(!(r.ex||r.pil))continue;
  let bad=false;for(let k=0;k+1<path.length&&!bad;k++){const a=path[k],b=path[k+1];
   if(r.ex){if(Math.abs(a.y-r.y)<100&&r.x<a.x+a.w+34&&r.x+r.w>a.x-34)bad=true}
   else{const lo=Math.min(a.x,b.x)-24,hi=Math.max(a.x+a.w,b.x+b.w)+24;if(r.x<hi&&r.x+r.w>lo&&r.y<a.y&&r.y+r.h>b.y-PH-70)bad=true}}
  if(bad){rects.splice(i,1);}}
 // rest campfires along the route (every ~30m early, sparser later) + a berry beside each
 {const CPD=120+DIFF*240,big=camps.slice();let ly=0,ci=0;
  for(const r of path){for(const c of big)if(c.y<ly&&c.y>=r.y)ly=c.y;
   if(!r.path||r.camp||r.peak||!rects.includes(r)||r.w<40||r.y-TOP<CPD*.5||big.some(c=>c.y<r.y&&r.y-c.y<CPD*.5))continue;
   if(ly-r.y>=CPD){camps.push({x:r.x+Math.min(r.w/2,14),y:r.y,b:-1,k:100+ci++,mini:1});foods.push({id:fid++,x:r.x+r.w-8,y:r.y-7,k:'berry'});ly=r.y}}}
 foods=foods.filter(f=>rects.some(r=>!r.side&&f.x>=r.x&&f.x<=r.x+r.w&&Math.abs(f.y+7-r.y)<1));
 rects.push(peakR);
 ensurePath();
 // early levels: catch ledges beside the first path ledges so a missed jump doesn't drop all the way to the beach; kept only if the validated route stays intact
 if(DIFF<.35&&NAV.path){const L0=NAV.path.length;let added=0;for(let i=1;i<Math.min(path.length,7)&&added<4;i++){const r=path[i];if(r.peak||r.camp)continue;for(const sd of[-1,1]){const w=34,x=sd<0?r.x-w-PW-4:r.x+r.w+PW+4,y=r.y+28;if(x<2||x+w>W-2||y>-PH-30)continue;
  if(rects.some(q=>q!==rects[0]&&q!==r&&!q.side&&x<q.x+q.w+PW+2&&x+w>q.x-PW-2&&y-PH-24<q.y+q.h&&y+16>q.y))continue;
  rects.push({x,y,w,h:10,ex:1,catch:1});navInit();const res=navSearch(nodeAt(rects[0],W/2-6));if(res.ok&&res.path.length<=L0){NAV.path=res.path;added++}else rects.pop()}}navInit();NAV.path=navSearch(nodeAt(rects[0],W/2-6)).path}
 if(!NAV.path&&tries<6)genWorld(lv,(sd!=null?sd:LV*7919+104729)+977,tries+1);

// ---------- navigation: reachability validator (mirrors player physics with safety margin) ----------

document.addEventListener('click',e=>{const b=e.target.closest('.gb,.sw');if(!b||b.disabled)return;if(b.dataset.g)pickGender(b.dataset.g);else pickColor(+b.dataset.c)});
function failNet(m){clearTimeout(joinTimer);connGen++;st(m);$('bRetry').classList.remove('hide');const w=ws;ws=null;try{w&&w.close()}catch(_){}}
function connect(first,onMsg,dl,gen){
 try{ws&&ws.close()}catch(_){}
 if(!dl){dl=Date.now()+75000;gen=++connGen;clearTimeout(joinTimer);joinTimer=setTimeout(()=>{if(gen===connGen&&!net)failNet('無法連上伺服器，請稍後再試')},75000);$('bRetry').classList.add('hide');st('連線伺服器中…');
  const wt=setTimeout(()=>{if(gen===connGen&&!net)st('伺服器喚醒中，約需 30–60 秒…')},2500)}
 if(gen!==connGen)return;
 let s;try{s=new WebSocket(RELAY_URL)}catch(e){failNet('無法連上伺服器');return}
 ws=s;
 s.onopen=()=>{if(ws===s)wsend(first)};
 s.onmessage=safe(e=>{if(ws!==s)return;const m=JSON.parse(e.data);
  if(m.t==='ping'){wsend({t:'pong'});return}
  if(m.t==='roster'){serverRoster=true;showLobby(m.pl.map(p=>({id:p.id,n:p.n,g:p.g,ci:p.c,h:p.h})));return}
  if(m.t==='colorTaken'){toast(`顏色已被 ${m.by} 選走`);return}
  if(m.t==='error'){net=false;failNet(ERR[m.e]||('錯誤：'+m.e));if(mode==='room')leave(true);return}
  onMsg(m)});
 s.onclose=()=>{if(ws!==s)return;ws=null;const was=net;net=false;
  if(!was){if(gen===connGen&&Date.now()<dl-3000){st('伺服器喚醒中，約需 30–60 秒…');fetch(HTTP_URL,{mode:'no-cors',cache:'no-store'}).catch(()=>{});setTimeout(()=>connect(first,onMsg,dl,gen),3000)}else if(gen===connGen)failNet('無法連上伺服器，請稍後再試');return}
  remotes={};
  if(!isHost&&mode==='room'&&!reconnTried){reconnTried=true;st('連線中斷，重新連線中…');join(roomCode,true);return}
  toast(isHost?'與伺服器斷線，改為單人模式':'與房主斷線，改為單人模式');
  if(mode==='room'){leave(true);failNet('與伺服器斷線')}}
}
function host(){
 getNick();lastAction=host;isHost=true;
 serverRoster=false;connect({t:'create',name:myName,g:myGender,c:myCI},m=>{
  if(m.t==='created'){clearTimeout(joinTimer);myId=m.id;roomCode=m.code;net=true;conns={};remotes={};lobby={[myId]:{n:myName,g:myGender,ci:myCI,col:COLORS[myCI],h:1}};openRoom();bcLobby()}
  else if(m.t==='peer-join'){conns[m.id]=peerConn(m.id)}
  else if(m.t==='peer-leave'){const n=lobby[m.id]&&lobby[m.id].n;delete conns[m.id];delete lobby[m.id];delete remotes[m.id];bcLobby();if(n)toast(`${n} 離線了`)}
  else if(m.t==='msg')hostHandle(m.from,m.d,false,conns[m.from]||peerConn(m.from));
 });
}
function hostHandle(from,d,self,c){
 if(self){if(d.t==='win')win(d.n,d.tm);return}
 if(d.t==='hello'){
  if(lobby[from]&&mode==='play'){pendingSnap.add(from);flushSnaps();return}
  if(Object.keys(lobby).length>=4||(mode!=='room'&&mode!=='play')){c.send({t:'full'});setTimeout(()=>c.close(),300);return}
  const mid=mode==='play';
  conns[from]=c;const sr=serverRoster&&lobbyList.find(p=>p.id===from);let ci,g=d.g==='f'?'f':'m';
  if(sr){ci=sr.ci;g=sr.g}else{const used=Object.values(lobby).map(v=>v.ci);ci=(d.c>=0&&d.c<COLORS.length&&!used.includes(d.c))?d.c:COLORS.findIndex((_,i)=>!used.includes(i))}
  lobby[from]={n:String(d.n).slice(0,8),g,ci,col:COLORS[ci]};bcLobby();
  if(mid){pendingSnap.add(from);flushSnaps();const n=lobby[from].n;for(const id in conns)if(id!==from)conns[id].send({t:'pjoin',n});toast(`${n} 加入了遊戲`)}
 }else if(d.t==='pick'){const L=lobby[from];if(!L)return;if(d.g)L.g=d.g==='f'?'f':'m';
  if(d.c!=null&&!Object.entries(lobby).some(([id,v])=>id!==from&&v.ci===d.c)&&d.c>=0&&d.c<COLORS.length){L.ci=d.c;L.col=COLORS[d.c]}bcLobby();
 }else if(d.t==='st'){const L=lobbyList.find(p=>p.id===from)||lobby[from];if(L)remotes[from]=Object.assign(remotes[from]||{dx:d.x,dy:d.y},d,{n:L.n,g:L.g,ci:L.ci})}
 else if(d.t==='eat'){eaten.add(d.id);for(const id in conns)conns[id].send({t:'eaten',id:d.id})}
 else if(d.t==='win'){for(const id in conns)conns[id].send(d);win(d.n,d.tm)}
}
let pendingSnap=new Set();
// mid-game join: send full snapshot once host is standing (not respawning)
function flushSnaps(){if(!isHost||mode!=='play'||!P||P.down||!pendingSnap.size)return;
 const ps={[myId]:{x:P.x,y:P.y,f:P.face,c:P.cling,d:0,a:ANIMS.indexOf(animOf(P)),n:myName,g:myGender,ci:myCI}};
 for(const id in remotes){const r=remotes[id];ps[id]={x:r.x,y:r.y,f:r.f,c:r.c,d:r.d,a:r.a,n:r.n,g:r.g,ci:r.ci}}
 const snap={t:'snap',seed,lava,lo:lavaOn,eaten:[...eaten],el:elapsed,cp:checkpoint,camp:P.camp,h:{x:P.x,y:P.y,f:P.face,c:P.cling,gr:P.ground},ps};
 for(const id of pendingSnap)if(conns[id])conns[id].send(snap);pendingSnap.clear()}
function findSpawn(h,oth=[]){
 const ok=(x,y)=>x>=0&&x+PW<=W&&!hit(x,y,PW,PH)&&y+PH<lava-6&&!oth.some(o=>Math.abs(o.x-x)<PW&&Math.abs(o.y-y)<PH);
 const ground=(x,y)=>{for(let d=0;d<=60;d++){if(!ok(x,y+d))return null;if(hit(x,y+d+1,PW,PH))return y+d}return null};
 const order=h.f>0?[-1,1]:[1,-1];
 for(const k of[1,2,3,4,6])for(const s of order)for(const dy of[0,-10,-20,-35,10]){const x=h.x+s*k*(PW+2),y=h.y+dy;if(!ok(x,y))continue;const g=ground(x,y);if(g!=null)return{x,y:g,c:0}}
 if(h.c){for(const dy of[0,-PH-2,PH+2]){const y=h.y+dy,x=h.x;if(ok(x,y)&&hit(h.c<0?x-2:x+PW,y+2,2,PH-4))return{x,y,c:h.c}}}
 for(let r=1;r<12;r++)for(const s of[-1,1])for(const dy of[0,-r*12,r*12]){const x=h.x+s*r*10,y=h.y+dy;if(ok(x,y)){const g=ground(x,y);if(g!=null)return{x,y:g,c:0}}}
 return{x:h.x,y:h.y,c:0}}
function applySnap(d){remotes={};startGame(d.seed);
 for(const id of d.eaten)eaten.add(id);lava=d.lava;lavaOn=!!d.lo;t0=performance.now()-d.el*1000;elapsed=d.el;
 checkpoint=d.cp;P.camp=d.camp;
 for(const id in d.ps){if(id===myId)continue;const v=d.ps[id];remotes[id]=Object.assign({dx:v.x,dy:v.y},v)}
 const sp=findSpawn(d.h,Object.values(remotes));Object.assign(P,{x:sp.x,y:sp.y,cling:sp.c,vx:0,vy:0,face:d.h.f||1});bestY=P.y;camY=P.y-200;
 toast('已加入遊戲，出現在房主旁邊！')}
function netTick(){
 if(isHost)flushSnaps();
 const me={x:+P.x.toFixed(1),y:+P.y.toFixed(1),f:P.face,c:P.cling,d:P.down?1:0,a:ANIMS.indexOf(animOf(P))};
 if(isHost){const ps={[myId]:{...me,n:myName,g:myGender,ci:myCI}};for(const id in remotes){const r=remotes[id];ps[id]={x:r.x,y:r.y,f:r.f,c:r.c,d:r.d,a:r.a,n:r.n,g:r.g,ci:r.ci}}
  for(const id in conns)conns[id].send({t:'ps',ps,lava,lo:lavaOn})}
 else hostConn&&hostConn.send({t:'st',...me});
}
function join(code,auto){
 getNick();code=String(code).replace(/\D/g,'');if(code.length!==4){st('請輸入 4 位數邀請碼');return}
 if(!auto)reconnTried=false;lastAction=()=>join(code);isHost=false;roomCode=code;
 serverRoster=false;connect({t:'join',code,name:myName,g:myGender,c:myCI},m=>{
  if(m.t==='joined'){clearTimeout(joinTimer);myId=m.id;net=true;remotes={};hostConn={open:true,send:d=>wsend({t:'msg',d})};hostConn.send({t:'hello',n:myName,g:myGender,c:myCI});if(m.started)st('加入進行中的遊戲…');else openRoom()}
  else if(m.t==='host-left'){net=false;remotes={};toast('房主離開了，房間已關閉');if(mode==='room'){leave(true);st('房主離開了，房間已關閉')}else st('房主離開了');try{ws&&ws.close()}catch(_){}ws=null}
  else if(m.t==='msg')clientHandle(m.d);
 });
}
function clientHandle(d){
 if(d.t==='lobby'){if(!serverRoster)showLobby(d.pl)}
 else if(d.t==='full'){net=false;leave(true);st('房間已滿或已開始')}
 else if(d.t==='start')startGame(d.seed);
 else if(d.t==='snap')applySnap(d);
 else if(d.t==='pjoin')toast(`${d.n} 加入了遊戲`);
 else if(d.t==='ps'){if(mode!=='play')return;lava=d.lava;if(d.lo)lavaOn=true;
  for(const id in d.ps){if(id===myId)continue;const v=d.ps[id];remotes[id]=Object.assign(remotes[id]||{dx:v.x,dy:v.y},v)}
  for(const id in remotes)if(!d.ps[id])delete remotes[id]}
 else if(d.t==='eaten'||d.t==='eat')eaten.add(d.id);
 else if(d.t==='win')win(d.n,d.tm);
}
function openRoom(){mode='room';$('menu').classList.add('hide');$('end').classList.add('hide');$('room').classList.remove('hide');$('rcode').textContent=roomCode;
 $('bStart').classList.toggle('hide',!isHost);$('rlvw').classList.toggle('hide',!isHost);renderLv();$('wait').classList.toggle('hide',isHost);st('');renderPickers()}
function leave(keepStatus){connGen++;auMusic(false);clearTimeout(joinTimer);const w=ws;ws=null;try{if(w){if(w.readyState===1)w.send(JSON.stringify({t:'leave'}));w.close()}}catch(_){}net=false;isHost=false;conns={};lobby={};lobbyList=[];remotes={};hostConn=null;mode='menu';P=null;
 ['room','end'].forEach(i=>$(i).classList.add('hide'));$('ctl').classList.add('hide');$('menu').classList.remove('hide');if(keepStatus!==true)st('');renderPickers()}
function hostStart(lv){const s=Math.max(1,Math.min(NLV,lv||+$('rlv').value||nextLv()));wsend({t:'started'});for(const id in conns)conns[id].send({t:'start',seed:s});startGame(s);setTimeout(()=>{if(net&&isHost&&(mode!=='play'||!P||!rects.length||LV!==s)&&mode!=='end'){console.warn('host start watchdog');startGame(s)}},1500)}

// ---------- menu wiring ----------
try{if(localStorage.nick)$('nick').value=localStorage.nick}catch(_){}
renderPickers();
const qp=new URLSearchParams(location.search).get('room');if(qp){$('code').value=qp.replace(/\D/g,'').slice(0,4);st('已帶入房間代碼，輸入暱稱後按「加入房間」')}
$('bSolo').onclick=()=>{getNick();net=false;startGame(nextLv())};
$('bLvs').onclick=()=>{renderLv();$('menu').classList.add('hide');$('lvs').classList.remove('hide')};
$('bLvBack').onclick=()=>{$('lvs').classList.add('hide');$('menu').classList.remove('hide')};
$('bNext').onclick=()=>{const n=Math.min(NLV,LV+1);if(net&&isHost)hostStart(n);else if(!net)startGame(n)};
renderLv();
$('bHost').onclick=host;
$('code').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)};
$('hintb').onclick=()=>{if(mode==='play'&&P&&!P.down){makeHint();progT=elapsed}};
$('bRetry').onclick=()=>lastAction&&lastAction();
$('bJoin').onclick=()=>join($('code').value);
$('bStart').onclick=()=>hostStart();
$('muteb').onclick=e=>{e.stopPropagation();auSetMute(!AU.muted)};auSetMute(AU.muted);
document.addEventListener('click',e=>{if(e.target.closest('button,.sw,.gb')&&e.target.id!=='muteb')setTimeout(()=>sfx('click'),0)});
$('bLeave').onclick=()=>leave();
$('bCopy').onclick=async()=>{const u=location.origin+location.pathname+'?room='+roomCode;
 try{await navigator.clipboard.writeText(u);st('已複製：'+u)}catch(_){prompt('複製此連結',u)}};
$('bAgain').onclick=()=>{if(net&&isHost)hostStart(LV);else if(!net)startGame(LV)};
$('bMenu').onclick=()=>leave();
// ---------- debug (?debug=1): all levels unlocked + panel + keys ----------
function dbgTeleport(m){if(!P||mode!=='play')return;const ty=-m*4-PH;let best=null;for(const n of NAV.nodes){if(n.r.side)continue;const d=Math.abs(n.y-ty);if(!best||d<best.d)best={n,d}}
 if(!best)return;const n=best.n;Object.assign(P,{x:(n.a+n.b)/2,y:n.y,vx:0,vy:0,down:false});checkpoint={x:P.x,y:P.y};camY=P.y-200;hint=null;bestY=P.y;toast(`DEBUG 傳送 ${Math.max(0,-(P.y+PH)/4)|0} m`)}
function dbgZone(b){dbgTeleport(Math.max(0,b*BL/4+2))}
if(DEBUG){renderLv();const d=document.createElement('div');d.id='dbg';d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:4px;z-index:9;background:rgba(0,0,0,.75);color:#fff;font:12px sans-serif;padding:4px 6px;border-radius:6px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:96vw';
 d.innerHTML='DBG 關<input id="dLv" type="number" min=1 max='+NLV+' value=1 style="width:42px"><button id="dGo">跳關</button> m<input id="dM" type="number" value=50 style="width:48px"><button id="dTp">傳送</button><button id="dZ">下一區</button><label><input id="dInf" type="checkbox">∞體力</label>';
 document.body.appendChild(d);d.querySelectorAll('button').forEach(b=>b.style.cssText='min-width:0;padding:2px 6px;font-size:12px;margin:0');
 const go=lv=>{lv=Math.max(1,Math.min(NLV,lv|0));$('dLv').value=lv;if(net&&isHost)hostStart(lv);else if(!net){getNick();startGame(lv)}};
 $('dGo').onclick=()=>go(+$('dLv').value);$('dTp').onclick=()=>dbgTeleport(+$('dM').value);$('dZ').onclick=()=>dbgZone(Math.min(NB-1,biomeAt(P?P.y:0)+1));
 $('dInf').onchange=e=>{DBG_INF=e.target.checked};
 addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key;
  if(k==='['||k===']'){go(LV+(k===']'?1:-1))}else if(k==='t'||k==='T')dbgTeleport(Math.max(0,-(P.y+PH)/4)+(k==='T'?-25:25));
  else if(k>='1'&&k<='4')dbgZone(+k-1);else if(k==='i'){DBG_INF=!DBG_INF;$('dInf').checked=DBG_INF;toast('∞體力 '+(DBG_INF?'開':'關'))}})}
