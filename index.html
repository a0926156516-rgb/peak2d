<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--rf:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","jf-openhuninn-2.0","Yuanti TC","Microsoft JhengHei UI",system-ui,"PingFang TC","Noto Sans TC",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#111;touch-action:none;font-family:var(--rf);color:#fff;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,20,35,.82);padding:20px;text-align:center;z-index:5;overflow:auto}
.hide{display:none!important}

.howto{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:340px;width:100%;font-size:14px;text-align:left}

.howto i{font-style:normal;font-size:22px;flex:none;width:26px;text-align:center}
.howto .wide{grid-column:1/3;font-size:12.5px;opacity:.85;justify-content:center}
.zh{grid-column:1/-1;text-align:left;font-weight:900;font-size:16px;padding:5px 10px;border-radius:10px;margin-top:6px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.lvb{min-width:0;width:60px;height:auto;min-height:60px;padding:3px 0!important;padding:0;font-size:16px;line-height:1.05;position:relative;border-radius:12px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.lvb small{display:block;font-size:11px;font-weight:700}
.lvb.lock{background:#2b3442;color:#9aa6b6;box-shadow:none;border:1px dashed #4a586c}
.lvb.lock small{font-size:12px}
.lvb .st{color:#fff3a0;letter-spacing:-1px;font-size:11px;text-shadow:0 1px 1px rgba(0,0,0,.6)}
#rbadge{display:flex;flex-direction:column;align-items:center;background:linear-gradient(#ffd27a,#f2a33a);color:#2a1600;border-radius:20px;padding:6px 26px 8px;box-shadow:0 5px 0 #b4512a;cursor:pointer;min-width:220px}
#rlvw.lvpick{display:flex;align-items:center;gap:8px}.lvpick button{min-width:0;width:52px;height:52px;padding:0;font-size:20px;border-radius:50%}

#gen{z-index:20;background:rgba(10,20,35,.9);gap:14px}#gen .gw{position:relative;width:120px;height:70px}

#gen .gc{position:absolute;left:14px;bottom:4px;width:12px;height:18px;border-radius:4px;background:#f2a33a;box-shadow:0 0 0 2px #2a1600 inset;animation:gclimb 1.4s ease-in-out infinite}
@keyframes gclimb{0%{transform:translate(0,0)}25%{transform:translate(22px,-24px)}50%{transform:translate(42px,-46px)}75%{transform:translate(64px,-24px)}100%{transform:translate(86px,0)}}
#gen .gt{font-size:20px;font-weight:900;letter-spacing:2px}#gen .gb{width:min(240px,70vw);height:14px;border-radius:7px;background:rgba(255,255,255,.15);overflow:hidden;box-shadow:0 0 0 2px #ffd27a}

#rbadge small{font-size:14px;font-weight:800;opacity:.75}

.sub{opacity:.8;margin:0 0 6px}
button{font:inherit;font-size:18px;padding:12px 18px;border:0;border-radius:12px;background:#f2a33a;color:#2a1600;font-weight:700;min-width:200px;touch-action:manipulation}
button.alt{background:#3d6b8c;color:#fff}
input{font:inherit;font-size:18px;padding:10px;border-radius:10px;border:0;width:200px;text-align:center;-webkit-user-select:text;user-select:text}

.cp .sw.tk{filter:grayscale(.85) brightness(.55);cursor:not-allowed}
.pv{position:static!important;display:inline-block;width:44px!important;height:56px!important;pointer-events:none}

<script>
"use strict";
addEventListener('DOMContentLoaded',()=>{try{artBg()}catch(_){}});
// ---------- setup ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=1,CW=0,CH=0;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);CW=innerWidth;CH=innerHeight;cv.width=CW*DPR|0;cv.height=CH*DPR|0}
addEventListener('resize',resize);resize();
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

const W=360,NLV=50;let BL=1500,NB=4,TOP=-6000,LV=1,DIFF=0;
function levelCfg(lv){LV=Math.max(1,Math.min(NLV,lv|0));DIFF=(LV-1)/(NLV-1);const H=1200+DIFF*5200;NB=LV<4?2:LV<13?3:4;BL=Math.round(H/NB/4)*4;TOP=-BL*NB}
const BIOMES=[
 {n:'海灘',rock:'#cfa86a',edge:'#efd49a',sky:['#6cc0f0','#fbe6b8'],mt:['#a9cfe6','#8bb7cf','#6f9db6'],fog:'#fff4dc'},
 {n:'叢林',rock:'#4f7a3a',edge:'#7fb34f',sky:['#4fa592','#d2eeb4'],mt:['#8fc4a8','#5e9c78','#3d7656'],fog:'#d8f3d0'},
 {n:'雪山',rock:'#8b98a8',edge:'#f4f8ff',sky:['#8aa6d4','#eef2fa'],mt:['#c9d4ea','#a6b6d6','#8496bc'],fog:'#f4f8ff'},
 {n:'火山',rock:'#4a3030',edge:'#8a4a32',sky:['#2e1620','#d8653a'],mt:['#6a3438','#4e2428','#331618'],fog:'#ff9a6a'}];
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,t)=>{const A=hx(a),B=hx(b);return`rgb(${A.map((v,i)=>v+(B[i]-v)*t|0)})`};
function artBg(){const L=(c,pts)=>`<path d='M0 600 ${pts} L400 600Z' fill='${c}'/>`,B=BIOMES;const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600' preserveAspectRatio='xMidYMax slice'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${B[2].sky[0]}'/><stop offset='.6' stop-color='${B[0].sky[0]}'/><stop offset='1' stop-color='${B[0].sky[1]}'/></linearGradient></defs><rect width='400' height='600' fill='url(#s)'/><circle cx='320' cy='120' r='34' fill='#fff6c8' opacity='.85'/>${L(B[2].mt[0],'L0 330 L70 250 L120 300 L190 170 L250 260 L300 220 L400 320')}<path d='M190 170 L172 200 L186 195 L196 206 L206 192 L214 198Z' fill='#f4f8ff'/>${L(B[1].mt[1],'L0 420 L60 360 L130 410 L200 340 L280 400 L340 350 L400 390')}${L(B[0].mt[2],'L0 480 L90 440 L170 470 L260 430 L330 465 L400 445')}${L(B[0].edge,'L0 540 Q100 520 200 535 T400 525')}<path d='M190 170 V140' stroke='#444' stroke-width='2'/><path d='M191 140 l16 5 l-16 5z' fill='#e8433a'/><rect width='400' height='600' fill='rgba(10,20,35,.38)'/></svg>`;document.documentElement.style.setProperty('--artbg',`url("data:image/svg+xml,${encodeURIComponent(svg)}")`)}
const biomeAt=y=>Math.max(0,Math.min(NB-1,Math.floor(-y/BL)));
// Character colors: swap hex values here. Order = colorIndex (server uses indexes 0..3).
const COLORS=['#e8483b','#2f8fe0','#3fb85a','#f2b630'];
const COLOR_NAMES=['紅','藍','綠','黃'];
let myGender='m',myCI=0,serverRoster=false;
try{if(localStorage.gender==='f')myGender='f';const c=+localStorage.color;if(c>=0&&c<COLORS.length)myCI=c}catch(_){}
const saveChar=()=>{try{localStorage.gender=myGender;localStorage.color=myCI}catch(_){}};
const gSym=g=>g==='f'?'♀':'♂';
// ---------- character art: sprite sheets from characters/manifest.json, procedural fallback ----------
const SPR={ok:false,m:null,sheets:{},tint:{}};
(async()=>{try{const r=await fetch('characters/manifest.json',{cache:'no-cache'});if(!r.ok)return;const m=await r.json();
 const load=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='characters/'+src});
 for(const g of['male','female']){const d=m.sheets&&m.sheets[g];if(!d)continue;
  SPR.sheets[g]=Array.isArray(d)?{perColor:await Promise.all(d.map(load))}:d.colored?{perColor:await Promise.all(d.colored.map(load)),scale:d.scale,name:d.name}:{base:await load(d.base||d),mask:d.mask?await load(d.mask):null,scale:d.scale,name:d.name}}
 SPR.m=m;SPR.ok=!!(SPR.sheets.male&&SPR.sheets.female);if(SPR.ok)renderPickers()}catch(e){console.info('no character sprites, using procedural',e&&e.message)}})();
function tintedMask(g,ci){const k=g+ci;if(SPR.tint[k])return SPR.tint[k];const mk=SPR.sheets[g].mask,c=document.createElement('canvas');c.width=mk.width;c.height=mk.height;
 const x=c.getContext('2d');x.drawImage(SPR.sheets[g].base,0,0);x.globalCompositeOperation='multiply';x.fillStyle=COLORS[ci];x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-in';x.drawImage(mk,0,0);return SPR.tint[k]=c}
// Draws a character with feet at (0,0) in the current transform. anim: idle|walk|jump|climb|fall; frame: running counter (seconds); facing: 1|-1
function drawCharacter(ctx,gender,colorIndex,anim,frame,facing){

function failNet(m){clearTimeout(joinTimer);connGen++;st(m);$('bRetry').classList.remove('hide');const w=ws;ws=null;try{w&&w.close()}catch(_){}}
function connect(first,onMsg,dl,gen){
 try{ws&&ws.close()}catch(_){}
 if(!dl){dl=Date.now()+75000;gen=++connGen;clearTimeout(joinTimer);joinTimer=setTimeout(()=>{if(gen===connGen&&!net)failNet('無法連上伺服器，請稍後再試')},75000);$('bRetry').classList.add('hide');st('連線伺服器中…');
  const wt=setTimeout(()=>{if(gen===connGen&&!net)st('伺服器喚醒中，約需 30–60 秒…')},2500)}
 if(gen!==connGen)return;
 let s;try{s=new WebSocket(RELAY_URL)}catch(e){failNet('無法連上伺服器');return}
 ws=s;
 s.onopen=()=>{if(ws===s)wsend(first)};
 s.onmessage=safe(e=>{if(ws!==s)return;const m=JSON.parse(e.data);
  if(m.t==='ping'){wsend({t:'pong'});return}
  if(m.t==='roster'){serverRoster=true;showLobby(m.pl.map(p=>({id:p.id,n:p.n,g:p.g,ci:p.c,h:p.h})));return}
  if(m.t==='colorTaken'){toast(`顏色已被 ${m.by} 選走`);return}
  if(m.t==='error'){net=false;failNet(ERR[m.e]||('錯誤：'+m.e));if(mode==='room')leave(true);return}
  onMsg(m)});
 s.onclose=()=>{if(ws!==s)return;ws=null;const was=net;net=false;
  if(!was){if(gen===connGen&&Date.now()<dl-3000){st('伺服器喚醒中，約需 30–60 秒…');fetch(HTTP_URL,{mode:'no-cors',cache:'no-store'}).catch(()=>{});setTimeout(()=>connect(first,onMsg,dl,gen),3000)}else if(gen===connGen)failNet('無法連上伺服器，請稍後再試');return}
  remotes={};
  if(!isHost&&mode==='room'&&!reconnTried){reconnTried=true;st('連線中斷，重新連線中…');join(roomCode,true);return}
  toast(isHost?'與伺服器斷線，改為單人模式':'與房主斷線，改為單人模式');
  if(mode==='room'){leave(true);failNet('與伺服器斷線')}}
}

function hostHandle(from,d,self,c){
 if(self){if(d.t==='win')win(d.n,d.tm);return}
 if(d.t==='hello'){
  if(lobby[from]&&mode==='play'){pendingSnap.add(from);flushSnaps();return}
  if(Object.keys(lobby).length>=4||(mode!=='room'&&mode!=='play')){c.send({t:'full'});setTimeout(()=>c.close(),300);return}
  const mid=mode==='play';
  conns[from]=c;const sr=serverRoster&&lobbyList.find(p=>p.id===from);let ci,g=d.g==='f'?'f':'m';
  if(sr){ci=sr.ci;g=sr.g}else{const used=Object.values(lobby).map(v=>v.ci);ci=(d.c>=0&&d.c<COLORS.length&&!used.includes(d.c))?d.c:COLORS.findIndex((_,i)=>!used.includes(i))}
  lobby[from]={n:String(d.n).slice(0,8),g,ci,col:COLORS[ci]};bcLobby();
  if(mid){pendingSnap.add(from);flushSnaps();const n=lobby[from].n;for(const id in conns)if(id!==from)conns[id].send({t:'pjoin',n});toast(`${n} 加入了遊戲`)}
 }else if(d.t==='pick'){const L=lobby[from];if(!L)return;if(d.g)L.g=d.g==='f'?'f':'m';
  if(d.c!=null&&!Object.entries(lobby).some(([id,v])=>id!==from&&v.ci===d.c)&&d.c>=0&&d.c<COLORS.length){L.ci=d.c;L.col=COLORS[d.c]}bcLobby();
 }else if(d.t==='st'){if(d.lv!=null&&d.lv!==LV)return;const L=lobbyList.find(p=>p.id===from)||lobby[from];if(L)remotes[from]=Object.assign(remotes[from]||{dx:d.x,dy:d.y},d,{n:L.n,g:L.g,ci:L.ci})}
 else if(d.t==='eat'){eaten.add(d.id);for(const id in conns)conns[id].send({t:'eaten',id:d.id})}
 else if(d.t==='win'){for(const id in conns)conns[id].send(d);winSoon(d.n,d.tm)}
 else if(d.t==='lavaLow'){if(Number.isFinite(d.y)&&lava<d.y)lava=d.y}
}

function flushSnaps(){if(!isHost||mode!=='play'||!P||P.down||!pendingSnap.size)return;

function findSpawn(h,oth=[]){
 const ok=(x,y)=>x>=0&&x+PW<=W&&!hit(x,y,PW,PH)&&y+PH<lava-6&&!oth.some(o=>Math.abs(o.x-x)<PW&&Math.abs(o.y-y)<PH);
 const ground=(x,y)=>{for(let d=0;d<=60;d++){if(!ok(x,y+d))return null;if(hit(x,y+d+1,PW,PH))return y+d}return null};
 const order=h.f>0?[-1,1]:[1,-1];
 const far=x=>Math.abs(x-h.x)>=50&&!oth.some(o=>Math.abs(o.x-x)<50);for(const k of[60,72,90,110,130,160])for(const s of order)for(const dy of[0,-10,-20,-35,10]){const x=h.x+s*k,y=h.y+dy;if(!ok(x,y)||!far(x))continue;const g=ground(x,y);if(g!=null)return{x,y:g,c:0}}
 if(h.c){for(const dy of[0,-PH-2,PH+2]){const y=h.y+dy,x=h.x;if(ok(x,y)&&hit(h.c<0?x-2:x+PW,y+2,2,PH-4))return{x,y,c:h.c}}}
 for(let r=1;r<12;r++)for(const s of[-1,1])for(const dy of[0,-r*12,r*12]){const x=h.x+s*r*10,y=h.y+dy;if(ok(x,y)){const g=ground(x,y);if(g!=null)return{x,y:g,c:0}}}
 return{x:h.x,y:h.y,c:0}}

 const sp=findSpawn(d.h,Object.values(remotes));Object.assign(P,{x:sp.x,y:sp.y,cling:sp.c,vx:0,vy:0,face:d.h.f||1});if(!sp.c)settle();netTick();bestY=P.y;camY=P.y-200;

}
function join(code,auto){

  if(m.t==='joined'){clearTimeout(joinTimer);myId=m.id;net=true;remotes={};hostConn={open:true,send:d=>wsend({t:'msg',d})};hostConn.send({t:'hello',n:myName,g:myGender,c:myCI});if(m.started)st('加入進行中的遊戲…');else openRoom()}

function clientHandle(d){

 else if(d.t==='full'){net=false;leave(true);st('房間已滿或已開始')}

 else if(d.t==='snap')applySnap(d);

 else if(d.t==='ps'){if(mode!=='play')return;lava=(P&&P.invT>0&&lavaFloor)?Math.max(d.lava,lavaFloor):d.lava;if(d.lo)lavaOn=true;

  if(!d.only)for(const id in remotes)if(!d.ps[id])delete remotes[id]}
 else if(d.t==='eaten'||d.t==='eat')eaten.add(d.id);
 else if(d.t==='win')winSoon(d.n,d.tm);

}

function dbgPlats(){return NAV.nodes.filter(n=>!n.r.side&&Math.min(n.b,W-PW-6)-Math.max(n.a,6)>=0).sort((a,b)=>b.y-a.y||a.a-b.a)}
function dbgTeleport(m,fromHost,pi,re){if(!P||mode!=='play'){if(!re)setTimeout(()=>dbgTeleport(m,fromHost,pi,1),300);return}if(!re){const lv0=LV;for(const ms of[250,700])setTimeout(()=>{/* right after a level jump the first teleport could be undone by the level-start reset: re-apply once if we're not where we were sent and haven't moved */if(LV===lv0&&mode==='play'&&P&&DTPY!=null&&Math.abs(P.y-DTPY)>30&&!K.left&&!K.right&&!K.jump){dbgTeleport(m,fromHost,pi,1)}},ms)}if(net&&isHost&&!fromHost)for(const id in conns)conns[id].send({t:'tp',m,pi});const ty=-m*4-PH,np=net?Math.max(1,lobbyList.length):1,need=(np-1)*56+PW+4;let best=null;for(const n of NAV.nodes){if(n.r.side)continue;const a=Math.max(n.a,6),bb=Math.min(n.b,W-PW-6);if(bb<a)continue;const d=Math.abs(n.y-ty)+(bb-a<need?400:0);if(!best||d<best.d)best={n,d}}
 if(pi!=null&&pi>=0){const L=dbgPlats();best={n:L[Math.min(L.length-1,pi|0)]}}if(!best||!best.n)return;const n=best.n;dbgPI=dbgPlats().indexOf(n);const ix=net?Math.max(0,lobbyList.findIndex(p=>p.id===myId)):0;// players get evenly spaced slots (>=56px apart) inside the ledge and the visible level; food only nudges the whole group
 let A=Math.max(n.a,6),B=Math.min(n.b,W-PW-6);{/* never spawn hugging the world wall: leave room to walk off that side */const a2=n.a<6?A+30:A,b2=n.b>W-PW-6?B-30:B;if(b2-a2>=0){A=a2;B=b2}}const span=Math.min(B-A,(np-1)*64),slot=k=>np<2?0:k*span/(np-1);let g0=A,bs=-1e9;for(let x=A;x+span<=B+.01;x+=4){let sc=-Math.abs(x+span/2-(A+B)/2)*.5;for(let k=0;k<np;k++){const px=x+slot(k),fd=Math.min(99,...foods.filter(f=>Math.abs(f.y-(n.y+9))<40).map(f=>Math.abs(f.x-(px+6))));sc+=Math.min(fd,40)*3}if(sc>bs){bs=sc;g0=x}}P.x=Math.max(A,Math.min(B,g0+slot(ix%np)));Object.assign(P,{y:n.y,tpG:1.5,vx:0,vy:0,down:false,cling:0,ground:true,invT:3});settle();if(hit(P.x,P.y,PW,PH)){P.x=Math.max(n.a,Math.min(n.b,(n.a+n.b)/2-PW/2));P.y=n.y;settle()}DTPY=P.y;P.tpG=1.5;P.invT=3;P.stam=maxS(P);if(lavaOn&&lava<P.y+PH+300&&(!net||isHost))lava=P.y+PH+300;checkpoint={x:P.x,y:P.y,tp:1};camY=P.y-200;hint=null;bestY=P.y;mile=Math.floor(-(P.y+PH)/200);mileT=0;toast(`DEBUG 傳送 ${Math.max(0,-(P.y+PH)/4)|0} m · 平台 #${dbgPI}`,'tp')}
function dbgZone(b){if(b>NB-1){toast(`已是最後一區（本關只有 ${NB} 區，山頂 ${Math.max(0,-TOP/4)|0} m）`,'tp');return}dbgTeleport(Math.max(0,b*BL/4+2))}
if(DEBUG){renderLv();const d=document.createElement('div');d.id='dbg';d.style.cssText='position:fixed;left:6px;top:auto;bottom:calc(228px + env(safe-area-inset-bottom));max-width:min(330px,94vw)!important;z-index:9;background:rgba(0,0,0,.75);color:#fff;font:12px sans-serif;padding:4px 6px;border-radius:6px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:96vw';const dSm=()=>{const sm=innerWidth<300||innerHeight<520;d.style.transform=sm?'scale(.7)':'';d.style.transformOrigin='0 0';d.style.setProperty('max-width',sm?'165px':'min(330px,94vw)','important');d.style.top=sm?'42%':'auto';d.style.bottom=sm?'auto':'calc(228px + env(safe-area-inset-bottom))';/* above the d-pad, clear of the HUD, ？ and the room card */d.style.background=sm?'rgba(0,0,0,.55)':'rgba(0,0,0,.75)'};dSm();addEventListener('resize',dSm);/* small iframes: shrink the debug panel so the HUD/play view stays readable */
 d.innerHTML='<button id="dCol">🐞</button><span id="dBody" style="display:contents">DBG 關<input id="dLv" type="number" min=1 max='+NLV+' value=1 style="width:42px"><button id="dGo">跳關</button> m<input id="dM" type="number" value=50 style="width:48px"><button id="dTp">傳送</button><button id="dZ">下一區</button> 平台#<input id="dP" type="number" min=0 value=0 style="width:42px"><button id="dPg">傳送</button><div id="dJ" style="flex-basis:100%;white-space:pre-line;font:11px monospace;color:#ffe94a"></div><label><input id="dInf" type="checkbox">∞體力</label><div id="dHelp" style="flex-basis:100%;font-size:11px;opacity:.8"></div></span>';
 document.body.appendChild(d);d.querySelectorAll('button').forEach(b=>{b.style.cssText='min-width:0;padding:2px 6px;font-size:12px;margin:0';b.tabIndex=-1;b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>b.blur())});
 // keyboard never activates debug controls (Space after a click used to re-press 跳關/傳送); keys still reach the game
 addEventListener('keydown',e=>{const t=e.target;if(t&&t.closest&&t.closest('#dbg')&&t.tagName!=='INPUT'){t.blur();if(e.key===' '||e.key==='Enter')e.preventDefault()}},true);d.addEventListener('change',e=>{if(e.target.type==='checkbox')e.target.blur()});
 {const col=c=>{$('dBody').style.display=c?'none':'contents';d.style.background=c?'rgba(0,0,0,.4)':'rgba(0,0,0,.75)'};let cz=innerWidth<520;if(cz){d.style.maxWidth=(innerWidth<300||innerHeight<520)?'165px':'230px';d.style.maxHeight='34vh';d.style.overflowY='auto';d.style.fontSize='11px';$('dHelp').style.display='none'}col(cz);$('dCol').onclick=()=>col(cz=!cz)}
 const go=lv=>{lv=Math.max(1,Math.min(NLV,lv|0));$('dLv').value=lv;if(net&&isHost)hostStart(lv);else if(!net){getNick();loadGame(lv)}};
 cv.tabIndex=-1;const unf=()=>{const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();try{cv.focus({preventScroll:true})}catch(_){}};/* give keys back to the game */
 $('dGo').onclick=()=>{go(+$('dLv').value);unf()};$('dTp').onclick=()=>{dbgTeleport(+$('dM').value);unf()};d.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.key==='Enter'){e.preventDefault();const b={dLv:'dGo',dM:'dTp',dP:'dPg'}[e.target.id];if(b)$(b).onclick();unf()}});$('dZ').onclick=()=>dbgZone(biomeAt(P?P.y:0)+1);
 $('dPg').onclick=()=>{dbgTeleport(0,0,+$('dP').value|0);unf()};setInterval(()=>{const j=$('dJ');if(!j)return;const L=P&&NAV?dbgPlats().length:0;const pl=P&&NAV?dbgPlats():[],pn=r=>{const i=r?pl.findIndex(n=>n.r===r):-1;return i<0?'-':i};j.textContent=(JLOG?`起跳平台 #${pn(JLOG.r0)}　最遠水平距離 ${Math.round(JLOG.mx)}px　峰值高度 ${Math.round(JLOG.pk)}px (${(JLOG.pk/4).toFixed(1)}m)\n跳：起 x${JLOG.x0|0} → 落 x${JLOG.x1==null?'…':JLOG.x1|0}　水平 ${JLOG.x1==null?'…':Math.round(JLOG.x1-JLOG.x0)}px　${JLOG.x1==null?'空中':JLOG.np?'✔ 新平台 #'+pn(JLOG.r1):'✘ 同一平台/未登上'}`:'跳：尚無紀錄')+`　平台 #${dbgPI<0?'-':dbgPI}/${Math.max(0,L-1)}`},120);$('dInf').onchange=e=>{DBG_INF=e.target.checked};setInterval(()=>{const pl=mode==='play';const sm=innerWidth<300||innerHeight<520;d.style.top=pl&&sm?'42%':'auto';d.style.bottom=pl?(sm?'auto':'calc(228px + env(safe-area-inset-bottom))'):'calc(8px + env(safe-area-inset-bottom))'},300);
 const hp=()=>{const h=$('dHelp');if(h)h.textContent=`鍵：[ ] 換關 · t/T ±25m · 1–${NB} 傳送到第1–${NB}區起點（不是山頂）· p/P 平台#±1 · i ∞體力 · 存檔與一般模式分開`};hp();setInterval(hp,1000);
 addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key;
  if(k==='['||k===']'){go(LV+(k===']'?1:-1))}else if(k==='t'||k==='T')dbgTeleport(Math.max(0,-(P.y+PH)/4)+(k==='T'?-25:25));
  else if(k>='1'&&k<='4')dbgZone(+k-1);else if(k==='p'||k==='P'){const v=Math.max(0,(dbgPI<0?0:dbgPI)+(k==='p'?1:-1));$('dP').value=v;dbgTeleport(0,0,v)}else if(k==='i'){DBG_INF=!DBG_INF;$('dInf').checked=DBG_INF;toast('∞體力 '+(DBG_INF?'開':'關'))}})}
